[package]
name = "livre-doc"
description = "Live script document model and .mlx / .m reading and writing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's clock, where `std::time::SystemTime::now` aborts.
web-time = "1.1"
