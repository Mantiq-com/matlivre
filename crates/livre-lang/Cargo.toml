[package]
name = "livre-lang"
description = "Lexer, parser and interpreter for the MatLivre MATLAB-compatible language"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["jit", "native"]
# Native compilation of loops and scalar functions with Cranelift, which cannot run in
# WebAssembly: without it every statement is interpreted.
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
# Threads, the process clock and the clipboard, which a browser does not give a program.
native = ["dep:rayon", "dep:cpu-time", "dep:arboard", "faer/rayon"]

[dependencies]
rayon = { version = "1.12", optional = true }
rustfft = "6"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
cpu-time = { version = "1", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
hound = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
# Without its default `rayon` feature faer stays single-threaded, which is what a browser
# can run; `native` turns the threads back on.
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "sparse-linalg"] }
cranelift-codegen = { version = "0.137", optional = true }
cranelift-frontend = { version = "0.137", optional = true }
cranelift-jit = { version = "0.137", optional = true }
cranelift-module = { version = "0.137", optional = true }
cranelift-native = { version = "0.137", optional = true }
libm = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"
calamine = "0.37"
rust_xlsxwriter = "0.102"
complex-bessel = "0.3"
num-complex = "0.4"
geo = "0.33.1"
arboard = { version = "3.7", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's clocks, where `std::time::Instant::now` and `SystemTime::now` abort; chrono
# reads the browser's clock and time zone through `wasmbind` for the same reason.
web-time = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
